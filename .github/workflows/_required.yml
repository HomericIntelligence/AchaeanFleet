      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-achaeanfleet-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-achaeanfleet-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t achaeanfleet-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-unit-tests`.
      - name: unit-tests (in container)
        run: bash scripts/run_ci_local.sh unit-tests

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-achaeanfleet-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-achaeanfleet-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t achaeanfleet-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-integration-tests`.
      - name: integration-tests (in container)
        run: bash scripts/run_ci_local.sh integration-tests

  security-dependency-scan:
    name: security/dependency-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-achaeanfleet-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-achaeanfleet-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t achaeanfleet-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-security-dependency-scan`.
      - name: security-dependency-scan (in container)
        run: bash scripts/run_ci_local.sh security-dependency-scan

  security-secrets-scan:
    name: security/secrets-scan
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-achaeanfleet-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-achaeanfleet-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t achaeanfleet-ci:local .
      - name: Run Gitleaks
        run: |
          if [ -f .gitleaks.toml ]; then
            podman run --rm --userns=keep-id:uid=1000,gid=1000 \
              -v "$PWD:/workspace:Z" -w /workspace achaeanfleet-ci:local \
              gitleaks detect --source /workspace --config .gitleaks.toml \
                --report-format sarif --report-path gitleaks.sarif --redact
          else
            podman run --rm --userns=keep-id:uid=1000,gid=1000 \
              -v "$PWD:/workspace:Z" -w /workspace achaeanfleet-ci:local \
              gitleaks detect --source /workspace \
                --report-format sarif --report-path gitleaks.sarif --redact
          fi

      - name: Upload Gitleaks SARIF
        if: always() && github.event_name != 'merge_group' && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v3
        with:
          sarif_file: gitleaks.sarif

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install pinned source-check parser
        run: python3 -m pip install --require-hashes -r ci/structure-requirements.txt
      - name: build source configuration check (no image execution or publication)
        run: python3 scripts/check_ci_structure.py build

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
