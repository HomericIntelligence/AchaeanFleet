        run: python3 -m pip install --require-hashes -r ci/structure-requirements.txt
      - name: release source configuration check (no image execution or publication)
        run: python3 scripts/check_ci_structure.py release

  schema-validation:
    name: schema-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-achaeanfleet-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-achaeanfleet-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t achaeanfleet-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-schema-validation`.
      - name: schema-validation (in container)
        run: bash scripts/run_ci_local.sh schema-validation

  deps-version-sync:
    name: deps/version-sync
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-achaeanfleet-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-achaeanfleet-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t achaeanfleet-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-deps-version-sync`.
      - name: deps-version-sync (in container)
        run: bash scripts/run_ci_local.sh deps-version-sync

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-achaeanfleet-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
