      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t achaeanfleet-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-pixi-check`.
      - name: pixi-check (in container)
        run: bash scripts/run_ci_local.sh pixi-check

  justfile-check:
    name: justfile-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-achaeanfleet-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-achaeanfleet-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t achaeanfleet-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-justfile-check`.
      - name: justfile-check (in container)
        run: bash scripts/run_ci_local.sh justfile-check

  symlink-check:
    name: symlink-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-achaeanfleet-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-achaeanfleet-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t achaeanfleet-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-symlink-check`.
      - name: symlink-check (in container)
        run: bash scripts/run_ci_local.sh symlink-check

  merge-gate:
    name: merge-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - forbid-suppressions
      - lint
      - unit-tests
      - integration-tests
      - security-dependency-scan
      - security-secrets-scan
      - build
      - test
      - package
      - install
      - release
      - schema-validation
      - deps-version-sync
      - markdownlint
      - pixi-check
      - justfile-check
      - symlink-check
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -e '
            to_entries
            | map(select(.value.result != "success"))
            | if length == 0 then true
              else (map("\(.key): \(.value.result)") | join(", ") | error)
              end'
