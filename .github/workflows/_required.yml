      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install pinned source-check parser
        run: python3 -m pip install --require-hashes -r ci/structure-requirements.txt
      - name: test source configuration check (no image execution or publication)
        run: python3 scripts/check_ci_structure.py test

