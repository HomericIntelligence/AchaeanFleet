name: Monthly Digest Bump

on:
  schedule:
    # First of every month at 4 AM UTC
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-digests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (fetch-depth 0 for full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Git identity
        run: |
          git config user.name "HomericIntelligence[bot]"
          git config user.email "bot@HomericIntelligence.ai"

      - name: Fetch and extract base image digests
        id: digests
        run: |
          set -euo pipefail

          # Arrays to store image tags and their digests
          declare -a IMAGES=("node:26-slim" "python:3.14-slim" "python:3.12-slim" "debian:bookworm-slim")

          # Pull images and extract digests
          for image in "${IMAGES[@]}"; do
            echo "Pulling ${image} ..."
            docker pull --quiet "${image}"
          done

          # Create a temporary file to hold the digest mapping
          digest_file=$(mktemp)

          for image in "${IMAGES[@]}"; do
            digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${image}")
            # Extract just the sha256 portion and reformat as image:tag@sha256:...
            full_digest="${image}@${digest#*@}"
            echo "${image}=${full_digest}" >> "$digest_file"
            echo "Mapped: ${image} => ${full_digest}"
          done

          # Store the digest file path for later steps
          echo "digest_file=${digest_file}" >> "$GITHUB_OUTPUT"

      - name: Update Dockerfiles with new digests
        id: update_files
        run: |
          set -euo pipefail
          digest_file="${{ steps.digests.outputs.digest_file }}"
          files_changed=0

          # Source the digest mappings
          declare -A digest_map
          while IFS='=' read -r key value; do
            digest_map["${key}"]="${value}"
          done < "$digest_file"

          # image -> the Dockerfiles that pin it. versions.yml records the same
          # digest for each of these images (tests/test_base_image_digests.py
          # enforces the agreement), so both sides move in the same pass.
          declare -A consumers=(
            ["node:26-slim"]="bases/Dockerfile.node bases/Dockerfile.minimal bases/Dockerfile.python"
            ["python:3.14-slim"]="bases/Dockerfile.python"
            ["python:3.12-slim"]="vessels/aider/Dockerfile"
            ["debian:bookworm-slim"]="bases/Dockerfile.minimal"
          )

          for image in "${!consumers[@]}"; do
            new_digest="${digest_map[$image]#*@}"
            for file in ${consumers[$image]}; do
              old_digest=$(sed -n "s|^FROM ${image}@\(sha256:[0-9a-f]*\).*|\1|p" "$file" | head -1)
              if [ -z "$old_digest" ]; then
                echo "::error file=${file}::no 'FROM ${image}@sha256:...' line found"
                exit 1
              fi
              if [ "$old_digest" != "$new_digest" ]; then
                sed -i "s|${image}@${old_digest}|${image}@${new_digest}|" "$file"
                sed -i "s|${old_digest}|${new_digest}|" versions.yml
                echo "Updated ${file} (${image})"
                files_changed=$((files_changed + 1))
              fi
            done
          done
          echo "files_changed=${files_changed}" >> "$GITHUB_OUTPUT"

          # Clean up temp file
          rm "$digest_file"

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet -- bases/Dockerfile.* vessels/aider/Dockerfile versions.yml; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            echo "No changes detected; digests are already current."
          else
            echo "no_changes=false" >> "$GITHUB_OUTPUT"
            echo "Changes detected in Dockerfiles; will create PR."
          fi

      - name: Create branch and commit changes
        if: steps.check_changes.outputs.no_changes == 'false'
        run: |
          set -euo pipefail
          branch_name="auto/digest-bump-$(date +%Y-%m)"

          git checkout -b "$branch_name"
          git add bases/Dockerfile.* vessels/aider/Dockerfile versions.yml
          git commit -m "chore: monthly base image digest bump"

          echo "BRANCH_NAME=${branch_name}" >> $GITHUB_ENV

      - name: Push branch
        if: steps.check_changes.outputs.no_changes == 'false'
        run: |
          git push -u origin "$BRANCH_NAME"

      - name: Create pull request
        if: steps.check_changes.outputs.no_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' \
            "Automated monthly digest bump for base images." \
            "" \
            "Updates pinned digests in:" \
            "- bases/Dockerfile.node" \
            "- bases/Dockerfile.python" \
            "- bases/Dockerfile.minimal" \
            "- vessels/aider/Dockerfile" \
            "- versions.yml" \
            "" \
            "Closes #128" \
            > /tmp/pr-body.txt
          gh pr create \
            --title "chore: monthly base image digest bump" \
            --body-file /tmp/pr-body.txt \
            --head "$BRANCH_NAME" \
            --base main

      - name: Exit successfully
        if: steps.check_changes.outputs.no_changes == 'true'
        run: |
          echo "No digest changes required; workflow completed successfully."
          exit 0
