[workspace]
name = "achaean-fleet"
version = "0.1.0"
description = "Container infrastructure for the HomericIntelligence agent mesh"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
just       = ">=1.13"
pre-commit = ">=3.0"
python     = ">=3.13,<3.14"
pytest     = ">=8.1.0,<9"
pytest-cov = ">=5.0"

[tasks]
build-all   = "just build-all"
test        = "just test"
test-shell  = "just test-shell"
push        = "just push"
pytest      = "python -m pytest tests/ -v --cov=. --cov-report=term-missing"
test-python = "python -m pytest tests/ -v"

# conda-forge does not publish bats-core for linux-aarch64; the CI image
# supplies Debian BATS there. Preserve the existing AMD64 dev dependency.
[feature.dev.target.linux-64.dependencies]
bats-core = ">=1.11.0"

[environments]
dev = ["dev"]
