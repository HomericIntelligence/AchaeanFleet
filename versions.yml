# AchaeanFleet — Centralized Tool Versions Manifest
#
# Single source of truth for all pinned tool versions and checksums across
# base images and vessel Dockerfiles.  Base-image pins are not hand-copied:
# scripts/render_version_pins.py writes them into the generated ENV block of
# each base Dockerfile (tests/test_version_pins.py fails when they drift).
# Vessel Dockerfiles still declare their own ENV <TOOL>_VERSION line.
#
# SHA256 checksums are provided where available (i.e. where the Dockerfile
# already verifies them at build time).  For tools without checksum
# verification, add them as part of the next version bump.

# Standalone tool image. These pins do not change existing agent vessels.
athena_tools:
  platform: "linux/arm64"
  python_image: "python:3.14.10-slim-bookworm@sha256:3fe1a0b6c2d6b2ebb572906cdabeca75aeb558c0c17db5ffefbcf8094871c32b"
  debian_snapshot: "20261105T000000Z"
  git: "1:2.39.5-0+deb12u3"
  pip: "26.3"
  codex: "0.153.4"
  codex_arm64_sha256: "439c0dd0d6923f607b4e5cd1e3079c12f0b86f6e5007f07e377d6ad25e2d7bb9"
  just: "1.51.0"
  just_arm64_sha256: "ed7ec466b77709198fd4afed253dba0270203ba5eb1c006bee2b0139090284f5"
  uv: "0.12.10"
  uv_arm64_sha256: "9ff6b9d4665edcdd3a88dcc73cd1eb641754deb927f14e8c62ebfde6bf4f5f5e"
  uv_amd64_sha256: "173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b"
  athena_revision: "40c0d98df8ea1ff54360f1d1966d67b5e214c0c5"
  lock_sha256: "27230f4781f617149a03a7f5de39ff8535e3dd7350bf033cfe1fd8ec002c24e7"
  project_sha256: "ff8b147f1f9719627d4b6b0ce26c5324bbd3cde6748ecb0fdeafbdc883d19195"
  python_sha256: "4f4c88910b6d485ae689143880e5e81b595a48a51ecb391b2f14feaec106d180"

# ---------------------------------------------------------------------------
# Base image digests (updated weekly by .github/workflows/digest-bump.yml)
# ---------------------------------------------------------------------------
#
# Each entry records the tag and digest that the `used_by` Dockerfiles actually
# pin. tests/test_base_image_digests.py fails when a Dockerfile's FROM line and
# this block disagree, and the monthly digest-bump workflow rewrites both sides
# in one pass. `base_images` is the only place these digests are recorded: an
# entry whose `used_by` list omits a consumer cannot be kept in sync.
base_images:
  node:
    tag: "26-slim"
    digest: "sha256:14bf3eac4bf209d906d3c41256597d3ab1f926b2e93a79e9bdfe1efd32454239"
    used_by:
      - bases/Dockerfile.node
      - bases/Dockerfile.minimal
      - bases/Dockerfile.python
  python:
    tag: "3.14-slim"
    digest: "sha256:656d12e70054d5fda18a045e2494c96701e9792dd1445f95b3d038df954f57e9"
    used_by:
      - bases/Dockerfile.python
  python312:
    # Copy-only source stage in the aider vessel: aider-chat requires
    # >=3.10,<3.13, so that vessel carries its own interpreter.
    tag: "3.12-slim"
    digest: "sha256:876416ecde9aca2bcc90e1fb0c7a9500bbf749f5788b70f82d4c5a5c2357f8b4"
    used_by:
      - vessels/aider/Dockerfile
  debian:
    tag: "bookworm-slim"
    digest: "sha256:67b30a61dc87758f0caf819646104f29ecbda97d920aaf5edc834128ac8493d3"
    used_by:
      - bases/Dockerfile.minimal

